version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: teochew_postgres
    environment:
      POSTGRES_USER: teochew
      POSTGRES_PASSWORD: teochew123
      POSTGRES_DB: teochew_learning
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teochew -d teochew_learning"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: teochew_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teochew_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://teochew:teochew123@postgres:5432/teochew_learning
      DATABASE_URL_SYNC: postgresql://teochew:teochew123@postgres:5432/teochew_learning
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teochew_celery
    environment:
      DATABASE_URL: postgresql+asyncpg://teochew:teochew123@postgres:5432/teochew_learning
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - postgres
    command: celery -A app.tasks worker --loglevel=info --concurrency=2

volumes:
  postgres_data:
  redis_data:
